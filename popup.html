<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>RWTH 2FA Autofill</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				font-family: Arial, sans-serif;
				padding: 16px;
				min-width: 240px;
				margin: 0;
				background: Canvas;
				color: CanvasText;
			}
			.header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				margin-bottom: 12px;
			}
			.header h2 {
				margin: 0;
				font-size: 16px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.icon-btn {
				border: none;
				background: none;
				color: inherit;
				font-size: 18px;
				cursor: pointer;
				padding: 2px 4px;
				line-height: 1;
			}
			label {
				display: block;
				font-size: 13px;
				font-weight: bold;
				margin-bottom: 4px;
			}
			input {
				width: 100%;
				padding: 10px;
				margin-bottom: 10px;
				box-sizing: border-box;
			}
			#saveBtn {
				padding: 10px;
				width: 100%;
			}
			.code-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
			}
			#otpCode {
				font-family: "Courier New", monospace;
				font-size: 30px;
				font-weight: bold;
				letter-spacing: 2px;
			}
			#ring .ring-bg {
				fill: none;
				stroke: #e0e0e0;
				stroke-width: 4;
			}
			#ring .ring-fg {
				fill: none;
				stroke: #00549f;
				stroke-width: 4;
				stroke-linecap: round;
				transform: rotate(-90deg);
				transform-origin: center;
			}
			@media (prefers-color-scheme: dark) {
				#ring .ring-bg {
					stroke: #444;
				}
				#ring .ring-fg {
					stroke: #5b9bd5;
				}
			}
		</style>
	</head>
	<body>
		<div id="setupView" hidden>
			<div class="header">
				<h2>Setup</h2>
				<button id="cancelBtn" class="icon-btn" title="Cancel" hidden>
					✕
				</button>
			</div>
			<label for="serialNumber">Serial Number (TOTP12345678)</label>
			<input
				type="text"
				id="serialNumber"
				placeholder="Enter your Serial Number"
			/>
			<label for="otpSecret">OTP Secret (Sha1)</label>
			<input type="text" id="otpSecret" placeholder="Enter your OTP secret" />
			<button id="saveBtn">Save</button>
		</div>

		<div id="codeView" hidden>
			<div class="header">
				<h2 id="tokenName"></h2>
				<button id="redoBtn" class="icon-btn" title="Redo setup">⚙</button>
			</div>
			<div class="code-row">
				<span id="otpCode">··· ···</span>
				<svg
					id="ring"
					width="40"
					height="40"
					viewBox="0 0 40 40"
					aria-hidden="true"
				>
					<circle class="ring-bg" cx="20" cy="20" r="16"></circle>
					<circle
						class="ring-fg"
						id="ringProgress"
						cx="20"
						cy="20"
						r="16"
					></circle>
				</svg>
			</div>
		</div>

		<script src="popup.js"></script>
	</body>
</html>
